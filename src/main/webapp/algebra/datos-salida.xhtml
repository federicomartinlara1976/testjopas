<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">
	
	<p:dataTable id="tablaSoluciones"
             value="#{algebraBean.tablaSoluciones.filas}" 
             var="fila">
    
	    <p:columns value="#{algebraBean.columns}" 
	               var="columna" 
	               headerText="#{columna.header}">
	               
	     	<h:outputText rendered="#{columna.property eq 'index'}" value="#{algebraBean.tablaSoluciones.filas.indexOf(fila) + 1}">
	            <f:convertNumber pattern="#0" />
	        </h:outputText>
	        
	        <h:outputText rendered="#{columna.property ne 'index'}" value="#{fila.getValor(columna.property)}">
	            <f:convertNumber pattern="#0.000000" />
	        </h:outputText>
	        
	    </p:columns>
	    
	</p:dataTable>

</ui:composition>
