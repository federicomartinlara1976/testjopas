<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<div class="ui-g ui-fluid">
		<div class="field ui-g-12 ui-md-12 ui-lg-3">
			<h:outputLabel value="#{res['algebra.numeroCoeficientes']}"
				for="numeroCoeficientes" />
			<p:spinner id="numeroCoeficientes"
				value="#{algebraBean.algebraDTO.numeroCoeficientes}" min="2"
				max="10">
				<p:ajax process="@this"
					listener="#{algebraBean.cambiarCoeficientes}"
					update="panelCoeficientes" />
			</p:spinner>
		</div>
	</div>

	<p:outputPanel id="panelCoeficientes" layout="block"
		rendered="#{algebraBean.algebraDTO.numeroCoeficientes gt 0}">
		<h5>
			<h:outputText value="#{res['algebra.sistema']}" />
		</h5>
		<table class="c100 sistema">
			<tbody>
				<ui:repeat value="#{algebraBean.algebraDTO.matrizCoeficientes}"
					var="fila" varStatus="stf">
					<tr>
						<ui:repeat value="#{fila}" var="columna" varStatus="stc">
							<td><p:inputNumber decimalPlaces="2"
									value="#{algebraBean.algebraDTO.matrizCoeficientes[stf.index][stc.index]}"
									styleClass="c100" /> <h:outputText value="x" />
								<h:outputText value="#{stc.index+1}" /></td>
							<td><h:outputText value="+" rendered="#{!stc.last}" /> <h:outputText
									value="=" rendered="#{stc.last}" /></td>
						</ui:repeat>
						<td><p:inputNumber decimalPlaces="2"
								value="#{algebraBean.algebraDTO.terminos[stf.index]}"
								styleClass="c100" /></td>
					</tr>
				</ui:repeat>
			</tbody>
		</table>
	</p:outputPanel>

</ui:composition>
