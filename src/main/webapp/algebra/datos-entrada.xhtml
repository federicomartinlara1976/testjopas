<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<div class="ui-g ui-fluid">
		<div class="field ui-g-12 ui-md-12 ui-lg-12">
			<div class="ui-g-12 ui-md-12 ui-lg-3">
				<h:outputLabel value="#{res['algebra.numeroCoeficientes']}"
					for="numeroCoeficientes" />
				<p:spinner id="numeroCoeficientes"
					value="#{algebraBean.algebraDTO.numeroCoeficientes}" min="2"
					max="10" buttons="horizontal">
					<p:ajax process="@form"
						event="valueChange"
						listener="#{algebraBean.cambiarCoeficientes}"
						update="panelCoeficientes,panelValoresIniciales" />
				</p:spinner>
			</div>
		</div>

		<p:outputPanel id="panelCoeficientes" layout="block"
			styleClass="ui-g-12 ui-md-12 ui-lg-6"
			rendered="#{algebraBean.algebraDTO.numeroCoeficientes gt 0}">
			<h5>
				<h:outputText value="#{res['algebra.sistema']}" />
			</h5>
			<table class="c100 sistema">
				<th colspan="#{algebraBean.algebraDTO.numeroCoeficientes}">A</th>
				<th colspan="1">b</th>
				<tbody>
					<ui:repeat value="#{algebraBean.algebraDTO.matrizCoeficientes}"
						var="fila" varStatus="stf">
						<tr>
							<ui:repeat value="#{fila}" var="columna" varStatus="stc">
								<td>
									<p:inputNumber decimalPlaces="6"
										value="#{algebraBean.algebraDTO.matrizCoeficientes[stf.index][stc.index]}"
										styleClass="c100" />
								</td>
							</ui:repeat>
							<td><p:inputNumber decimalPlaces="6"
									value="#{algebraBean.algebraDTO.terminos[stf.index]}"
									styleClass="c100" /></td>
						</tr>
					</ui:repeat>
				</tbody>
			</table>
		</p:outputPanel>

		<p:outputPanel id="panelValoresIniciales" layout="block"
			styleClass="ui-g-12 ui-md-12 ui-lg-6"
			rendered="#{sessionBean.opcion eq 'gradconj'}">
			<h5>
				<h:outputText value="#{res['algebra.valoresIniciales']}" />
			</h5>
			<table class="c100 sistema">
				<th colspan="1">x0</th>
				<tbody>
					<ui:repeat value="#{algebraBean.algebraDTO.matrizCoeficientes}"
						var="fila" varStatus="stf">
						<tr>
							<td><p:inputNumber decimalPlaces="6"
									value="#{algebraBean.algebraDTO.valoresIniciales[stf.index]}"
									styleClass="c100" /></td>
						</tr>
					</ui:repeat>
				</tbody>
			</table>
		</p:outputPanel>
	</div>

</ui:composition>
