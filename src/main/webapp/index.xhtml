<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:chronos="http://chronos.componentes.jsf/composite"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		<chronos:title type="3" value="#{res['app.title']}" />
	</ui:define>

	<ui:define name="content">
		<p:outputPanel layout="block"
			styleClass="funcionalidades ui-g-12 box shadow overview-box">
			<p:panel header="Test de Octave" styleClass="ui-g-12">
				<p>
					<h:outputText
						value="Aplicación web de prueba de interfaz java para Octave / Matlab" />
				</p>
				<p>
					<h:outputText
						value="La aplicación consiste en una serie de algoritmos numéricos:" />
				</p>
			</p:panel>

			<p:accordionPanel activeIndex="-1" styleClass="ui-g-12 box">
				<p:tab title="#{res['menu.raiz']}">
					<ul>
						<li><h:outputText
								value="Método de la bisección para encontrar la raíz de un polinomio" /></li>
						<li><h:outputText
								value="Método de la secante para encontrar la raíz de un polinomio" /></li>
						<li><h:outputText
								value="Método de Newton para encontrar la raíz de un polinomio" /></li>
					</ul>
				</p:tab>
				<p:tab title="#{res['menu.interpolacion']}">
					<ul>
						<li><h:outputText
								value="Mediante los valores de una función dada" /></li>
						<li><h:outputText 
								value="Mediante los valores de una tabla" /></li>
					</ul>
				</p:tab>
				<p:tab title="#{res['menu.integracion']}">
					<ul>
						<li><h:outputText
								value="Integración mediante la fórmula básica" /></li>
						<li><h:outputText
								value="Integración mediante la fórmula de Simpson" /></li>
					</ul>
				</p:tab>
				<p:tab title="#{res['menu.algebra']}">
					<ul>
						<li><h:outputText
								value="Resolución de sistemas de ecuaciones de grado 1" /></li>
						<li><h:outputText
								value="Resolución por el método de Gauss con pivote parcial" /></li>
						<li><h:outputText
								value="Resolución mediante factorización LU" /></li>
						<li><h:outputText
								value="Resolución mediante método del gradiente conjugado" /></li>
					</ul>
				</p:tab>
			</p:accordionPanel>
		</p:outputPanel>
	</ui:define>

</ui:composition>
