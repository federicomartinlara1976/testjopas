<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<div class="ui-g ui-fluid">
		<div class="field ui-g-12 ui-md-12 ui-lg-6">
			<h:outputLabel value="#{res['interpolacion.puntoInterpolar']}"
				for="puntoInterpolar" />
			<p:inputNumber id="puntoInterpolar"
				value="#{interpolacionBean.interpolacionDTO.puntoInterpolar}" />
		</div>
		<div class="field ui-g-12 ui-md-12 ui-lg-6">
			<h:outputLabel value="#{res['interpolacion.numeroPuntos']}"
				for="numeroPuntos" />
			<p:spinner id="numeroPuntos"
				value="#{interpolacionBean.interpolacionDTO.numeroPuntos}" min="1"
				max="100">
				<p:ajax process="@this"
					listener="#{interpolacionBean.cambiarPuntos}" update="datosEntrada" />
			</p:spinner>
		</div>

		<ui:repeat var="punto"
			value="#{interpolacionBean.interpolacionDTO.puntos}" varStatus="st">

			<div class="field ui-g-12 ui-md-12 ui-lg-6">
				<p:inputNumber decimalPlaces="6"
					value="#{interpolacionBean.interpolacionDTO.puntos[st.index].punto}"
					rendered="#{sessionBean.opcion eq 'funcion'}">
					<p:ajax event="change" process="@this"
						listener="#{interpolacionBean.calcularValor(st.index)}"
						update="datosEntrada" />
				</p:inputNumber>

				<p:inputNumber decimalPlaces="6"
					value="#{interpolacionBean.interpolacionDTO.puntos[st.index].punto}"
					rendered="#{sessionBean.opcion eq 'tabla'}" />
			</div>
			<div class="field ui-g-12 ui-md-12 ui-lg-6">
				<p:inputNumber decimalPlaces="6"
					value="#{interpolacionBean.interpolacionDTO.puntos[st.index].valor}"
					disabled="#{sessionBean.opcion eq 'funcion'}" />
			</div>
		</ui:repeat>
	</div>
</ui:composition>
