<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p>
		<h:outputText value="#{res['interpolacion.sp']}" />
		<strong><h:outputText value="#{interpolacionBean.sp}" /></strong>
	</p>

	<h5>
		<h:outputText value="#{res['interpolacion.y']}" />
	</h5>

	<p:dataTable var="item" value="#{interpolacionBean.y}">
		<p:column headerText="Valor">
			<h:outputText value="#{item}" />
		</p:column>
	</p:dataTable>
	
	<br/>

	<h5>
		<h:outputText value="#{res['interpolacion.tabla']}" />
	</h5>

	<p:dataTable id="tablaDiferencias"
             value="#{interpolacionBean.tablaDiferencias.filas}" 
             var="fila">
    
	    <p:columns value="#{interpolacionBean.columns}" 
	               var="columna" 
	               headerText="#{columna.header}">
	               
	     	<h:outputText rendered="#{columna.property eq 'index'}" value="#{interpolacionBean.tablaDiferencias.filas.indexOf(fila) + 1}">
	            <f:convertNumber pattern="#0" />
	        </h:outputText>
	        
	        <h:outputText rendered="#{columna.property ne 'index'}" value="#{fila.getValor(columna.property)}">
	            <f:convertNumber pattern="#0.000000" />
	        </h:outputText>
	        
	    </p:columns>
	    
	</p:dataTable>

</ui:composition>
