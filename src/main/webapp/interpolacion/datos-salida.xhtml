<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p>
		<h:outputText value="#{res['interpolacion.sp']}" />
		<strong><h:outputText value="#{interpolacionBean.sp}" /></strong>
	</p>

	<h5>
		<h:outputText value="#{res['interpolacion.y']}" />
	</h5>

	<p:dataTable var="item" value="#{interpolacionBean.y}">
		<p:column headerText="Valor">
			<h:outputText value="#{item}" />
		</p:column>
	</p:dataTable>

	<h5>
		<h:outputText value="#{res['interpolacion.tabla']}" />
	</h5>

	<p:dataTable id="tablaDiferencias"
		value="#{interpolacionBean.tablaDiferencias.filas}" var="fila">

		<!-- Columna de índice/fila -->
		<p:column headerText="#">
        	#{interpolacionBean.tablaDiferencias.filas.indexOf(fila) + 1}
      	</p:column>

		<!-- Columnas dinámicas -->
		<c:forEach items="#{interpolacionBean.encabezados}" 
               var="encabezado" 
               varStatus="status">
			<p:column headerText="#{encabezado}">
				<h:outputText
					value="#{interpolacionBean.obtenerValorCelda(fila, status.index)}">
					<f:convertNumber pattern="#0.0000000000" />
				</h:outputText>
			</p:column>
		</c:forEach>
	</p:dataTable>

</ui:composition>
