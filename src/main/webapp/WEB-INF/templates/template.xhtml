<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<title>.:: Springboot jopas test ::.</title>
	<meta content='text/html; charset=UTF-8' http-equiv="Content-Type" />
	<link href="#{resource['images/favicon.ico']}" rel="shortcut icon" />

	<link href="https://fonts.googleapis.com/css?family=Roboto+Condensed"
		rel="stylesheet" />
	<link rel="stylesheet"
		href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />

	<h:outputStylesheet library="css" name="layout-default.css" />
	<h:outputStylesheet library="css" name="styles.css" />
</h:head>

<h:body role="document">
	<f:view>
		<h:form prependId="false" enctype="multipart/form-data">
		    
		    <p:growl id="messages" showDetail="true" sticky="true" />  

			<p:outputPanel id="layoutWrapper" layout="block"
				styleClass="layout-wrapper menu-layout-static">
				<p:outputPanel layout="block" styleClass="topbar clearfix">
					<p:outputPanel layout="block" styleClass="topbar-left">
						<p:graphicImage styleClass="topbar-logo"
							title="Spring Boot ${environment.getProperty('spring-boot.version')}"
							alt="Spring Boot ${environment.getProperty('spring-boot.version')}"
							value="#{resource['images/spring-boot.png']}" />
						<div class="title">
							<span class="description"> <strong><h:outputText
										value="#{appBean.appName}" /></strong>
							</span> <span class="version"> <h:outputText
									value="#{appBean.appVersion}" />
							</span>
						</div>
					</p:outputPanel>

					<p:outputPanel layout="block" styleClass="topbar-right">
						<p:commandButton type="button" icon="pi pi-bars"
							onclick="PF('sidebar').show()" title="Menú" />
						<h3>Nostromo</h3>
					</p:outputPanel>
				</p:outputPanel>
				
				<p:outputPanel id="layoutMain" layout="block"
					styleClass="layout-main" style="box-shadow: -5px 0 25px lightgray inset;">

					<p:outputPanel id="layoutContent" layout="block"
						styleClass="layout-content">

						<ui:insert name="content"></ui:insert>

					</p:outputPanel>

				</p:outputPanel>

				<ui:include src="footer.xhtml" />
			</p:outputPanel>
			
			<p:sidebar widgetVar="sidebar" styleClass="sidebar" style="width: 550px;">
				<h3>Menu</h3>
				<p:outputPanel id="layoutMenuContainer" layout="block">

					<ui:include src="menu.xhtml" />

				</p:outputPanel>
			</p:sidebar>

			<ui:include src="wait.xhtml" />
			<ui:include src="expired.xhtml" />
		</h:form>
	</f:view>

</h:body>
</html>
