<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:chronos="http://chronos.componentes.jsf/composite"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="content">
		<p:outputPanel layout="block" styleClass="acerca ui-g dashboard">
			<p:outputPanel styleClass="ui-g-12">
				<p:toolbar id="toolbar">
					<p:toolbarGroup align="left">
						<h3>
							<h:outputText value="#{res['menu.raiz']}" />
						</h3>
					</p:toolbarGroup>
					<p:toolbarGroup align="right">
						<p class="description">
							<h:outputText value="#{res['menu.raiz.newton']}"
								rendered="#{sessionBean.opcion eq 'newton'}" />
							<h:outputText value="#{res['menu.raiz.secante']}"
								rendered="#{sessionBean.opcion eq 'secante'}" />
							<h:outputText value="#{res['menu.raiz.biseccion']}"
								rendered="#{sessionBean.opcion eq 'biseccion'}" />
						</p>
					</p:toolbarGroup>
				</p:toolbar>
			</p:outputPanel>

			<p:panel id="datosEntrada" styleClass="ui-g-12 ui-md-12 ui-lg-6">
				<f:facet name="header">
					<i class="pi pi-send"></i>
	             	Datos de entrada
	       		</f:facet>

				<f:facet name="actions">
					<p:commandButton icon="pi pi-save" process="@form" ajax="true"
						update="messages,resultados" actionListener="#{raizBean.calcular}"
						styleClass="edit-button rounded-button ui-button-success" />

					<p:commandButton icon="pi pi-replay" process="@form" ajax="true"
						update="datosEntrada,resultados" actionListener="#{raizBean.reset}" 
						styleClass="edit-button rounded-button ui-button-danger" />
						
					<p:commandButton title="Función" icon="pi pi-bars" process="@form" ajax="true"
						update="functionDialog" actionListener="#{raizBean.obtenerFuncion}"
						oncomplete="PF('functionDialog').show()"
						styleClass="edit-button rounded-button ui-button-success" />
						
					<p:commandButton title="Derivada" icon="pi pi-bars" process="@form" ajax="true"
						rendered="#{sessionBean.opcion eq 'newton'}"
						update="functionDialog" actionListener="#{raizBean.obtenerDerivada}"
						oncomplete="PF('functionDialog').show()"
						styleClass="edit-button rounded-button ui-button-success" />

				</f:facet>

				<ui:include src="/raiz/datos-entrada.xhtml" />
			</p:panel>

			<p:panel id="resultados" styleClass="ui-g-12 ui-md-12 ui-lg-6">
				<f:facet name="header">
					<i class="pi pi-send"></i>
	             	Resultados
	       		</f:facet>

				<ui:include src="/raiz/datos-salida.xhtml" />
			</p:panel>
		</p:outputPanel>
		
		<p:dialog id="functionDialog" header="#{raizBean.titulo}" showEffect="fade"
			modal="true" widgetVar="functionDialog" responsive="true" position="center"
			appendTo="@(form)">
			<p:outputPanel id="function-content" class="ui-fluid">
				<div class="field ui-g-12">
					<p:outputLabel for="name">Código</p:outputLabel>
					<p:inputTextarea id="name" readonly="true"
						value="#{raizBean.funcion}" />
				</div>
			</p:outputPanel>

			<f:facet name="footer">
				<p:commandButton value="Cancelar" icon="pi pi-times"
					onclick="PF('functionDialog').hide()" class="ui-button-secondary"
					type="button" />
			</f:facet>
		</p:dialog>
	</ui:define>

</ui:composition>
