<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:chronos="http://chronos.componentes.jsf/composite"
	template="/WEB-INF/templates/template.xhtml">
	
	<ui:define name="title">
		<chronos:title type="3" value="#{res['app.title']}" />	
	</ui:define>
	
	<ui:define name="menu">
		<ui:include src="/menu.xhtml" />	
	</ui:define>

	<ui:define name="content">
		<p:outputPanel layout="block" styleClass="acerca ui-g dashboard">
			<p:outputPanel layout="block" styleClass="ui-g-12">
				<p:outputPanel layout="block"
					styleClass="jumbotron ui-g-12 box shadow overview-box overview-box-1">
					<h1>
						<h:outputText value="#{res['menu.raiz']}" />
					</h1>
					<hr class="my-4" />
					<p class="description">
						<h:outputText value="#{res['menu.raiz.newton']}" rendered="#{sessionBean.opcion eq 'newton'}"/>
						<h:outputText value="#{res['menu.raiz.secante']}" rendered="#{sessionBean.opcion eq 'secante'}"/>
					</p>
				</p:outputPanel>
			</p:outputPanel>
			
			<p:panel id="datosEntrada" styleClass="ui-g-12 ui-md-12 ui-lg-6">
				<f:facet name="header">
					<i class="pi pi-send"></i>
	             	Datos de entrada
	       		</f:facet>
	       		
	       		<f:facet name="actions">
		            <p:commandButton icon="pi pi-save" process="@form" 
		            	ajax="true" update="messages resultados"
		            	actionListener="#{raizBean.calcular}"
						styleClass="edit-button rounded-button ui-button-success"/>
						
					<p:commandButton icon="pi pi-replay" process="@form" 
		            	actionListener="#{raizBean.reset}" immediate="true" ajax="true" update="datosEntrada resultados"
						styleClass="edit-button rounded-button ui-button-danger"/>
		            
				</f:facet>
				
				<ui:include src="/raiz/datos-entrada.xhtml" />
			</p:panel>
			
			<p:panel id="resultados" styleClass="ui-g-12 ui-md-12 ui-lg-6">
				<f:facet name="header">
					<i class="pi pi-send"></i>
	             	Resultados
	       		</f:facet>
	       		
	       		<ui:include src="/raiz/datos-salida.xhtml" />
			</p:panel>
		</p:outputPanel>	
	</ui:define>

</ui:composition>
