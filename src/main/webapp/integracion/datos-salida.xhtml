<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">
	
	<p>
		<h:outputText value="#{res['integracion.valor']}"/>
		<strong>
			<h:outputText value="#{integracionBean.valor}">
				<f:convertNumber pattern="#0.000000" />
			</h:outputText>
		</strong>
	</p>
	
	<p:outputPanel rendered="#{sessionBean.opcion eq 'integracion'}">
		<h5><h:outputText value="#{res['integracion.valores']}"/></h5>
	
		<p:dataTable var="item" value="#{integracionBean.valores}">
			<p:column headerText="Valor">
				<h:outputText value="#{item}" />
			</p:column>
		</p:dataTable>
	</p:outputPanel>

</ui:composition>
