<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:chronos="http://chronos.componentes.jsf/composite"
	template="/WEB-INF/templates/template.xhtml">
	
	<ui:define name="title">
		<chronos:title type="3" value="#{res['app.title']}" />	
	</ui:define>
	
	<ui:define name="content">
		<p:outputPanel layout="block" styleClass="acerca ui-g dashboard">
			<p:outputPanel styleClass="ui-g-12">
				<p:toolbar id="toolbar">
					<p:toolbarGroup align="left">
						<h3>
							<h:outputText value="#{res['menu.algebra']}" />
						</h3>
					</p:toolbarGroup>
					<p:toolbarGroup align="right">
						<p class="description">
							<h:outputText value="#{res['menu.algebra.sistema']}" rendered="#{sessionBean.opcion eq 'sistemas'}"/>
						</p>
					</p:toolbarGroup>
				</p:toolbar>
			</p:outputPanel>
		
			<p:panel id="datosEntrada" styleClass="ui-g-12 ui-md-12 ui-lg-12">
				<f:facet name="header">
					<i class="pi pi-send"></i>
	             	Datos de entrada
	       		</f:facet>

				<f:facet name="actions">
					<p:commandButton icon="pi pi-save" process="@form" ajax="true"
						update="messages,resultados"
						actionListener="#{algebraBean.calcular}"
						styleClass="edit-button rounded-button ui-button-success" />

					<p:commandButton icon="pi pi-replay" process="@form" ajax="true" 
						update="datosEntrada,resultados"
						actionListener="#{algebraBean.reset}" 
						styleClass="edit-button rounded-button ui-button-danger" />

				</f:facet>
				
				<ui:include src="/algebra/datos-entrada.xhtml" />

			</p:panel>
			
			<p:panel id="resultados" styleClass="ui-g-12 ui-md-12 ui-lg-12">
				<f:facet name="header">
					<i class="pi pi-send"></i>
	             	Resultados
	       		</f:facet>

				<ui:include src="/algebra/datos-salida.xhtml" />
			</p:panel>
			
		</p:outputPanel>	
	</ui:define>

</ui:composition>
