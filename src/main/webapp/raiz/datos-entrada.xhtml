<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<div class="ui-g ui-fluid">
		<div class="field ui-g-12 ui-md-12 ui-lg-6">
			<p:outputLabel value="#{res['raiz.puntoInicial']}" for="puntoInicial"/>
        	<p:inputNumber id="puntoInicial" decimalPlaces="6" value="#{raizBean.raizDTO.puntoInicial}" />
		</div>
		<p:outputPanel styleClass="field ui-g-12 ui-md-12 ui-lg-6"
			rendered="#{sessionBean.opcion eq 'secante'}">
			<h:outputLabel
				value="#{res['raiz.primeraAproximacion']}"
				for="primeraAproximacion" />
			<p:inputNumber id="primeraAproximacion" decimalPlaces="6"
							value="#{raizBean.raizDTO.primeraAproximacion}" />
		</p:outputPanel>
		<div class="field ui-g-12 ui-md-12 ui-lg-6">
			<h:outputLabel
				value="#{res['raiz.tolerancia']}" for="tolerancia" />
			<p:inputNumber id="tolerancia" decimalPlaces="6"
				value="#{raizBean.raizDTO.tolerancia}" />
		</div>
		<div class="field ui-g-12 ui-md-12 ui-lg-6">
			<h:outputLabel
				value="#{res['raiz.iteraciones']}" for="iteraciones"/>
			<p:spinner id="iteraciones"
				value="#{raizBean.raizDTO.iteraciones}" min="1" max="100" />
		</div>
	</div>

</ui:composition>
