<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<p>
		<h:outputText value="#{res['raiz.solucion']}" />
		<strong><h:outputText value="#{raizBean.sol}" /></strong>
	</p>
	<p>
		<h:outputText value="#{res['raiz.itRealizadas']}" />
		<strong><h:outputText value="#{raizBean.iteraciones}" /></strong>
	</p>

	<p:dataView var="valor" value="#{raizBean.valores}" rows="5"
		paginator="true" rowsPerPageTemplate="5,10,15" paginatorPosition="top"
		paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
		gridIcon="pi pi-th-large" listIcon="pi pi-bars">

		<p:dataViewListItem>
			<div class="product-list-item">
				<div class="product-list-detail">
					<div class="product-name">#{valor}</div>
				</div>
			</div>
		</p:dataViewListItem>
	</p:dataView>

</ui:composition>
